[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "o2o"
version = "0.1.0"
description = "ARS coursework: offline-to-online RL (OPT vs WSRL) on Gymnasium"
requires-python = ">=3.10"
# Versions verified on free Colab CPU in notebooks/00_setup_check (2026-10-18).
# numpy/pandas/matplotlib/torch are left to Colab's preinstalled builds.
dependencies = [
    "gymnasium[classic-control,box2d]==1.3.0",
    "d3rlpy==2.8.0",
    "h5py>=3.14",
    "numpy>=2.1",
    "pandas>=2.2",
    "matplotlib>=3.10",
    "torch",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["o2o*"]
